/*
 * La configuration de Gradle pour compiler et exécuter le projet.
 */

plugins {
    id 'application'
    id 'java'
    id 'org.openjfx.javafxplugin' version '0.1.0'
}

sourceCompatibility = '21'
targetCompatibility = '21'

repositories {
    mavenCentral()
}

application {
    mainClass = 'fr.univartois.butinfo.sae.cabinet.CabinetApplication'
}

javafx {
    version = '21.0.1'
    modules = ['javafx.controls', 'javafx.fxml']
}

configurations {
    mockitoAgent
}

dependencies {
    implementation 'org.slf4j:slf4j-api:2.0.17'
    implementation 'org.apache.logging.log4j:log4j-api:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-core:2.26.0'
    implementation 'org.apache.logging.log4j:log4j-slf4j2-impl:2.26.0'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.14.4'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.14.4'
    testImplementation 'org.assertj:assertj-core:3.27.7'
    testImplementation 'org.mockito:mockito-junit-jupiter:5.23.0'
    mockitoAgent('org.mockito:mockito-core:5.23.0') {
        transitive = false
    }
}

test {
    useJUnitPlatform()
    jvmArgs "-javaagent:${configurations.mockitoAgent.asPath}"
}